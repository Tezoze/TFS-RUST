name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # sqlx `query!` metadata lives in `.sqlx/` (see `cargo sqlx prepare`); no DB needed in CI.
  SQLX_OFFLINE: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Check Formatting
      run: cargo fmt --all -- --check
      
    - name: Run Clippy
      run: cargo clippy --workspace -- -D warnings
      
    - name: Run Tests
      # Note: We run the workspace tests
      run: cargo test --workspace

    - name: LuaLS check
      env:
        LUALS_VERSION: "3.18.2"
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
          | tar -xz -C "${RUNNER_TEMP}"
        # Workspace must be repo root so `.luarc.json` `library: ["./lua-defs"]` resolves.
        # `--check=data/lib` makes the workspace `data/lib` and every engine global looks undefined.
        "${RUNNER_TEMP}/bin/lua-language-server" --check=. --configpath=.luarc.json --checklevel=Warning
