name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # sqlx `query!` metadata lives in `.sqlx/` (see `cargo sqlx prepare`); no DB needed in CI.
  SQLX_OFFLINE: true

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
        
    - name: Check Formatting
      run: cargo fmt --all -- --check
      
    - name: Run Clippy
      run: cargo clippy --workspace -- -D warnings
      
    - name: Run Tests
      # Note: We run the workspace tests
      run: cargo test --workspace

    - name: Data-pack policy
      run: bash scripts/check_data_pack_policy.sh

    - name: LuaLS check
      env:
        LUALS_VERSION: "3.18.2"
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
          | tar -xz -C "${RUNNER_TEMP}"
        # Workspace must be repo root so `.luarc.json` `library: ["./lua-defs"]` resolves.
        # `--check=data/lib` makes the workspace `data/lib` and every engine global looks undefined.
        "${RUNNER_TEMP}/bin/lua-language-server" --check=. --configpath=.luarc.json --checklevel=Warning

  # Criterion hot_paths stays advisory for 1.0.0. The checker exits 0 when the
  # cached `main` baseline is missing, so requiring this job would fail the
  # release on bench noise or a cold runner. Drop continue-on-error after one
  # green compare against a saved `main` baseline.
  bench_gate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Criterion baselines
      uses: actions/cache@v4
      with:
        path: target/criterion
        key: bench-${{ github.base_ref || github.ref_name }}

    - name: Run microbenches (save baseline)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: cargo bench -p tfs-rust-core --bench hot_paths -- --noplot --save-baseline main

    - name: Run microbenches (compare to main)
      if: github.event_name != 'push' || github.ref != 'refs/heads/main'
      run: |
        set -euo pipefail
        if find target/criterion -type d -name main 2>/dev/null | grep -q .; then
          cargo bench -p tfs-rust-core --bench hot_paths -- --noplot --baseline main
        else
          echo "No cached 'main' baseline; running without --baseline"
          cargo bench -p tfs-rust-core --bench hot_paths -- --noplot
        fi
        python3 scripts/bench/check_regression.py
