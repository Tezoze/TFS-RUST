[package]
name = "tfs-rust-content"
version = "0.1.0"
edition = "2024"

[dependencies]
tfs-rust-common = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread"] }
thiserror = { workspace = true }
byteorder = { workspace = true }
quick-xml = { workspace = true }
roxmltree = "0.21"
mlua = { workspace = true }
serde = { version = "1", features = ["derive"] }
ron = { workspace = true }

[[bin]]
name = "patch-otb-waypoints"
path = "src/bin/patch_otb_waypoints.rs"

[[bin]]
name = "dump-items-json"
path = "src/bin/dump_items_json.rs"
