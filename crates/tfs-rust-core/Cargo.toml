[package]
name = "tfs-rust-core"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tfs-rust-common = { workspace = true }
tfs-rust-db = { workspace = true }
tfs-rust-net = { workspace = true }
tfs-rust-content = { workspace = true }
tfs-rust-lua = { path = "../tfs-rust-lua" }
slotmap = { workspace = true }
dashmap = { workspace = true }
mlua = { workspace = true }
rand = "0.10"
bitflags = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rustc-hash = "2"
smallvec = { version = "1", features = ["union"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[features]
default = []
# Enables simulation/diagnostic modules (`sim_scenario`) and `chase_kite_sim`.
# Tests auto-enable via `cfg(test)`; production builds exclude this.
# Sim binaries (`chase_kite_sim`) require `--features sim`. Dropped in Phase 5.
sim = ["dep:tracing-subscriber"]

[dev-dependencies]
proptest = "1.11"

[[bin]]
name = "path_compare"
path = "src/bin/path_compare.rs"

[[bin]]
name = "chase_kite_sim"
path = "src/bin/chase_kite_sim.rs"
required-features = ["sim"]
